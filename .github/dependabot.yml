version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    target-branch: "dev"
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"
    auto-merge: true
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    target-branch: "dev"
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"
    auto-merge: true
    commit-message:
      prefix: "chore(deps)"