# .golangci.yml - golangci-lint configuration for Pamawas correlator
# See https://golangci-lint.run/docs/configuration/ for all options

version: "2"

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unparam
    - noctx
    - rowserrcheck

linters-settings:
  gosec:
    excludes:
      - G104 # Ignore unhandled errors (we handle errors explicitly)
      - G115 # Ignore math/big.Int in tests
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    check-shadowing: true
  staticcheck:
    checks: ["all", "-ST1000"]

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - goconst
        - unparam
        - lll
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  modules-download-mode: readonly